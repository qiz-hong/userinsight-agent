# UserInsight Agent Configuration
# LangGraph 自主规划式分析 Agent

# --- Data Settings ---
data:
  file_path: "data/sample_user_data.csv"   # Input data file path
  user_id_column: "user_id"                 # User identifier column (optional hint)

# --- Data Cleaning ---
cleaning:
  drop_duplicates: true
  fill_missing_strategy: "auto"             # auto | median | mean | mode | drop
  high_missing_threshold: 0.8               # drop columns missing > 80%
  outlier_method: "iqr"

# --- LLM Agent Settings ---
llm:
  enabled: true                             # Enable/disable LLM decision layer
  model: "deepseek-chat"                    # LLM model name
  temperature: 0.3                          # Lower = more deterministic

# --- Agent Orchestration (LangGraph) ---
agent:
  max_iterations: 15                        # Hard cap on planner/executor/critic loop turns
  max_retries_per_step: 3                   # Critic retry budget per tool step
  memory_dir: "output/memory"               # ChromaDB persistent memory location

# --- Output ---
output:
  dir: "output"                             # Output directory
  excel_report: true
  html_report: true
  save_charts: true
